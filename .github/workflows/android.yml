name: android wallpaper

on:
  push:
    branches: [android]
    tags: ['wallpaper-v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        run: gradle -p android assembleRelease
      - name: Collect
        run: cp android/app/build/outputs/apk/release/app-release.apk Coaurora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coaurora-apk
          path: Coaurora.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/wallpaper-v')
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Android wallpaper ${{ github.ref_name }}
          body: |
            The coaurora aurora as an Android **live wallpaper** (home & lock screen),
            with a live-updating settings screen (speed / tilt / thickness / hue /
            curtains / fps).

            **Install:** download `Coaurora.apk` on the phone → open it → allow
            installs from your browser/files app if asked.

            **Set on the lock screen (Samsung One UI):** open the Coaurora app →
            *Set as wallpaper* → Apply → choose **Lock screen** or
            **Home and lock screens**.

            Signed with the project's committed sideload key, so future versions
            install over this one. Built from the `android` branch by CI.
          files: dist/Coaurora.apk
